<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="EduPay">
  <defs>
    <linearGradient id="tile" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#86ccff"/><stop offset="0.42" stop-color="#2f6df6"/><stop offset="1" stop-color="#19238f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#050b3a" stop-opacity="0"/><stop offset="1" stop-color="#050b3a" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="boardTop" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9defd"/>
    </linearGradient>
    <linearGradient id="sideL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7ea6ea"/><stop offset="1" stop-color="#5b82d4"/></linearGradient>
    <linearGradient id="sideR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a3c2f6"/><stop offset="1" stop-color="#7aa0e6"/></linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5f86d8"/><stop offset="0.45" stop-color="#c3d8fb"/><stop offset="1" stop-color="#5b82d4"/></linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1a6b" stop-opacity="0.55"/><stop offset="0.5" stop-color="#0b1a6b" stop-opacity="0"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3bd"/><stop offset="0.5" stop-color="#fbbf24"/><stop offset="1" stop-color="#b7791f"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <!-- glossy tile -->
  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect width="512" height="512" rx="116" fill="url(#shade)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3"/>

  <!-- 3D graduation cap -->
  <ellipse cx="256" cy="392" rx="158" ry="22" fill="#050b3a" opacity="0.42" filter="url(#soft)"/>
  <path d="M148 244 V318 C148 378 364 378 364 318 V244 Z" fill="url(#crown)"/>
  <path d="M148 244 V318 C148 378 364 378 364 318 V244 Z" fill="url(#under)"/>
  <path d="M148 318 C148 378 364 378 364 318" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
  <polygon points="60,200 256,278 256,304 60,226" fill="url(#sideL)"/>
  <polygon points="452,200 256,278 256,304 452,226" fill="url(#sideR)"/>
  <polygon points="256,122 452,200 256,278 60,200" fill="url(#boardTop)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  <polyline points="70,201 256,127 442,201" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- gold button, cord and tassel -->
  <ellipse cx="256" cy="200" rx="17" ry="9" fill="url(#gold)"/>
  <path d="M256 200 C322 200 394 214 418 244 L418 324" fill="none" stroke="#7a4a0c" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round" transform="translate(0 3)"/>
  <path d="M256 200 C322 200 394 214 418 244 L418 324" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
  <rect x="403" y="316" width="30" height="24" rx="9" fill="url(#gold)"/>
  <path d="M403 336 H433 L438 390 C438 398 402 398 398 390 Z" fill="url(#gold)"/>
  <path d="M410 342 L408 392 M418 342 V394 M426 342 L428 392" stroke="#8a5a10" stroke-opacity="0.38" stroke-width="3" stroke-linecap="round"/>
</svg>
